# ToyBox frontend — nginx configuration for the production container.
# Responsibilities: SPA fallback, /api reverse proxy to the API container,
# static-asset caching, compression. No TLS here — HTTPS terminates at the
# platform load balancer / reverse proxy in front of this container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ── Security headers (API sets its own via helmet) ─────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # ── Static assets: immutable, fingerprinted filenames ──────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── API reverse proxy ───────────────────────────────────────────────
    # Keeps the frontend same-origin: cookies stay first-party and CORS is
    # trivial. `api` is the compose service name of the backend container.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        # Razorpay webhooks POST here through the same route.
        client_max_body_size 100k;
    }

    # ── HTML entrypoint: never cached (must fetch fresh deploy) ────────
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── SPA fallback: client-side routes resolve to index.html ─────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
