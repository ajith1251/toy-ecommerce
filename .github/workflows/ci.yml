name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Unit · Coverage · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit & component tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

  backend:
    name: Backend · Lint · Tests · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend typecheck
        run: npm run server:lint

      - name: Backend tests (isolated PostgreSQL)
        run: npm run server:test

      - name: Backend build
        run: npm run server:build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: Docker · Build images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Verify both production images build (no push — deployment is a
      # deliberate, separate act; see docs/deployment.md).
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: false
          build-args: VITE_API_BASE_URL=/api

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: false

  audit:
    name: Dependencies · Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report-only: findings are reviewed per docs/production-operations.md;
    # breaking upgrades are never applied blindly by CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit (production dependencies)
        run: npm audit --omit=dev

      - name: Audit (all dependencies)
        run: npm audit
